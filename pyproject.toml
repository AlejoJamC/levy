[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "levy"
dynamic = ["version"]
description = "Semantic caching engine for LLM APIs – experimental core for cost optimisation"
authors = [{name = "John Alejandro Mantilla Celis", email = "J.Mantilla-Celis@liverpool.ac.uk"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "sentence-transformers>=3.0",
    "transformers>=4.48",
    "faiss-cpu>=1.7",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "anthropic>=0.40.0,<1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx2>=2.0",  # Starlette's TestClient (used by the API tests) requires httpx2
]
dashboard = [
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
include = ["levy*"]

[tool.setuptools.dynamic]
version = {attr = "levy.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["levy"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
